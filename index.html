<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>경영학 CBT 모의고사 (52문항 완벽 수록)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f2f4f7;
      color: #1f2937;
      padding: 12px;
      line-height: 1.5;
    }

    .cbt-container {
      max-width: 1050px;
      margin: 0 auto;
      display: flex;
      gap: 16px;
      align-items: flex-start;
    }

    .main-content {
      flex: 1;
      background: #ffffff;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
      width: 100%;
    }

    .sidebar {
      width: 280px;
      background: #ffffff;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 12px;
    }

    .sidebar-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 2px solid #e5e7eb;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .omr-list {
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      padding-right: 4px;
    }

    .omr-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid #e5e7eb;
      font-size: 13px;
      cursor: pointer;
      background-color: #f9fafb;
      transition: all 0.15s ease;
    }

    .omr-item.active {
      border-color: #2563eb;
      font-weight: bold;
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
    }

    .status-tag {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .status-unanswered {
      background-color: #e5e7eb;
      color: #6b7280;
    }

    .status-correct {
      background-color: #d1fae5;
      color: #047857;
    }

    .status-wrong {
      background-color: #fee2e2;
      color: #b91c1c;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 14px;
      border-bottom: 2px solid #e5e7eb;
      margin-bottom: 16px;
    }

    .badge {
      background-color: #eff6ff;
      color: #2563eb;
      font-size: 13px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
    }

    .progress-text {
      font-size: 14px;
      font-weight: 700;
      color: #4b5563;
    }

    .question-box {
      margin-bottom: 20px;
    }

    .question-title {
      font-size: 16px;
      font-weight: 700;
      color: #111827;
      white-space: pre-line;
      word-break: keep-all;
      line-height: 1.5;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }

    .option-btn {
      display: flex;
      align-items: center;
      width: 100%;
      padding: 12px 14px;
      font-size: 14px;
      text-align: left;
      background-color: #f9fafb;
      border: 1.5px solid #e5e7eb;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.15s ease;
      min-height: 48px;
    }

    .option-btn.correct {
      border-color: #059669;
      background-color: #ecfdf5;
      color: #047857;
      font-weight: 600;
    }

    .option-btn.wrong {
      border-color: #dc2626;
      background-color: #fef2f2;
      color: #b91c1c;
    }

    .explanation-box {
      background-color: #f8fafc;
      border-left: 4px solid #2563eb;
      padding: 14px 16px;
      border-radius: 6px;
      font-size: 13px;
      color: #334155;
      white-space: pre-line;
      margin-bottom: 20px;
      display: none;
      word-break: keep-all;
      line-height: 1.6;
    }

    .nav-buttons {
      display: flex;
      gap: 10px;
    }

    .btn {
      flex: 1;
      padding: 12px 0;
      font-size: 15px;
      font-weight: 600;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      text-align: center;
      min-height: 48px;
    }

    .btn-prev {
      background-color: #e5e7eb;
      color: #374151;
    }

    .btn-next {
      background-color: #2563eb;
      color: #ffffff;
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    @media (max-width: 768px) {
      .cbt-container {
        flex-direction: column;
      }
      .sidebar {
        width: 100%;
        max-height: 250px;
        position: static;
      }
      .omr-list {
        grid-template-columns: repeat(4, 1fr);
      }
    }
  </style>
</head>
<body>

  <div class="cbt-container">
    <div class="main-content">
      <div class="header">
        <span class="badge" id="categoryBadge">카테고리</span>
        <span class="progress-text"><span id="currentIndex">1</span> / <span id="totalIndex">52</span></span>
      </div>

      <div class="question-box">
        <div class="question-title" id="questionTitle">문제를 불러오는 중입니다...</div>
      </div>

      <div class="options-list" id="optionsList"></div>

      <div class="explanation-box" id="explanationBox"></div>

      <div class="nav-buttons">
        <button class="btn btn-prev" id="prevBtn" onclick="prevQuestion()" disabled>이전</button>
        <button class="btn btn-next" id="nextBtn" onclick="nextQuestion()">다음</button>
      </div>
    </div>

    <div class="sidebar">
      <div class="sidebar-title">
        <span>답안 현황</span>
        <span style="font-size: 12px; color: #6b7280;" id="scoreSummary">0/52</span>
      </div>
      <div class="omr-list" id="omrList"></div>
    </div>
  </div>

  <script>
    const questions = [
      {
        id: 1,
        category: "경영 - 마케팅",
        question: "01번 문제\n다음 중 기업이 고객, 정부, 시민단체 등 여러 집단과 언론 보도의 커뮤니케이션 활동으로 호의적인 관계를 유지하는 촉진 수단은?",
        options: ["PR (Public Relations)", "광고 (Advertising)", "인적 판매 (Personal Selling)", "판매 촉진 (Sales Promotion)", "다이렉트 마케팅 (Direct Marketing)"],
        answer: 1,
        explanation: "[정답] ① PR (Public Relations)\n\n[상세 해설]\nPR은 기업이 다양한 이해관계자(고객, 정부, 시민단체, 언론 등)와 호의적인 관계를 구축하고 유지하기 위해 펼치는 커뮤니케이션 활동입니다. 광고와 달리 비대가성 매체 보도(퍼블리시티)를 활용하는 경우가 많아 신뢰도가 높은 특징이 있습니다."
      },
      {
        id: 2,
        category: "경영 - 전략",
        question: "02번 문제\n다음 중 BCG 매트릭스에서 시장성장률은 낮으나 상대적 시장점유율은 높아 지속적으로 이윤을 창출하는 사업 부문은?",
        options: ["개 (Dog)", "스타 (Star)", "캐시카우 (Cash Cow)", "야생고양이 (Wild Cat)", "물음표 (Question Mark)"],
        answer: 3,
        explanation: "[정답] ③ 캐시카우 (Cash Cow)\n\n[상세 해설]\n캐시카우는 산업의 성장률은 낮지만 자사의 시장점유율이 높은 사업 분야입니다. 추가적인 대규모 투자 없이도 지속적인 현금흐름(Cash Flow)을 창출하여 기업의 다른 사업부(Star나 Question Mark)에 자금을 공급하는 역할을 합니다."
      },
      {
        id: 3,
        category: "경영 - 전략",
        question: "03번 문제\n다음 중 기업이 고객에게 독특한 가치를 제공하여 높은 가격 프리미엄을 얻는 마이클 포터(Michael E. Porter)의 본원적 전략은?",
        options: ["모방 전략", "수확 전략", "유지 전략", "차별화 전략", "원가우위 전략"],
        answer: 4,
        explanation: "[정답] ④ 차별화 전략\n\n[상세 해설]\n마이클 포터의 본원적 경쟁 전략 중 차별화 전략(Differentiation Strategy)은 제품의 품질, 디자인, 브랜드 이미지, 고객 서비스 등에서 경쟁사와 차별화된 독특한 가치를 제공함으로써 고객의 브랜드 충성도를 높이고 프리미엄 가격을 부여하는 전략입니다."
      },
      {
        id: 4,
        category: "경영 - 국제경영",
        question: "04번 문제\n다음 중 자원 투입의 위험 정도가 가장 낮으며 통제의 필요성도 가장 낮은 해외시장 진출방법은?",
        options: ["간접 수출", "라이선싱", "합작 투자", "직접 투자", "프랜차이징"],
        answer: 1,
        explanation: "[정답] ① 간접 수출\n\n[상세 해설]\n간접 수출(Indirect Exporting)은 국내의 수출대행업체나 무역상사를 통해 해외에 판매하는 방식으로, 기업이 직접 통제하는 범위가 가장 적은 반면 위험 부담과 자원 투입 역시 해외 진출 방식 중 가장 적습니다."
      },
      {
        id: 5,
        category: "경영 - 전략",
        question: "05번 문제\n산업구조분석모형(5 Forces Model)으로 기업 환경을 분석할 때 공급자의 교섭력이 강한 상황과 가장 거리가 먼 것은?",
        options: ["공급자의 수가 적은 경우", "구매자의 전환비용이 낮은 경우", "공급자의 전방통합 능력이 높은 경우", "공급하는 제품의 차별화 정도가 높은 경우", "구매자가 공급자의 비용구조에 대한 정보가 적은 경우"],
        answer: 2,
        explanation: "[정답] ② 구매자의 전환비용이 낮은 경우\n\n[상세 해설]\n구매자의 전환비용(Switching Cost)이 낮으면 구매자가 쉽게 다른 공급자로 바꿀 수 있으므로 구매자의 교섭력이 강해지고 공급자의 교섭력은 약해집니다. 따라서 전환비용이 '높아야' 공급자의 교섭력이 강화됩니다."
      },
      {
        id: 6,
        category: "경영 - 회계",
        question: "06번 문제\n다음 중 아래 설명에 해당하는 재무제표는?\n\n'특정 시점의 기업의 자산과 부채, 자본을 나타낸다. 차변에 있는 자산 금액의 합계는 대변에 있는 부채와 자본 금액의 합계와 항상 일치한다.'",
        options: ["주석", "자본변동표", "현금흐름표", "재무상태표", "손익계산서"],
        answer: 4,
        explanation: "[정답] ④ 재무상태표\n\n[상세 해설]\n재무상태표(Balance Sheet)는 특정 시점(예: 12월 31일)에 기업이 보유하고 있는 자산, 부채, 자본의 상태를 나타내는 정태적 재무제표입니다. 항상 '자산 = 부채 + 자본'이라는 대차평균의 원리가 성립합니다."
      },
      {
        id: 7,
        category: "경영 - 조직행동",
        question: "07번 문제\n브룸(Vroom)의 기대이론 중 '내가 높은 성과를 올리면 그에 상응하는 보상을 받을 것이다'라고 믿는 정도에 해당하는 개념은?",
        options: ["유의성 (Valence)", "타당성 (Validity)", "공정성 (Fairness)", "효과성 (Effectiveness)", "수단성 (Instrumentality)"],
        answer: 5,
        explanation: "[정답] ⑤ 수단성 (Instrumentality)\n\n[상세 해설]\n브룸의 기대이론은 동기부여 = 기대(Expectancy) × 수단성(Instrumentality) × 유의성(Valence)으로 설명됩니다.\n- 기대: 노력하면 성과를 낼 것이라는 확신\n- 수단성: 성과를 내면 원하는 보상이 주어질 것이라는 강도\n- 유의성: 보상이 주는 주관적 가치나 선호도"
      },
      {
        id: 8,
        category: "경영 - 조직이론",
        question: "08번 문제\n다음 중 유기적 조직에 비해 기계적 조직이 가진 특성으로 가장 거리가 먼 것은?",
        options: ["업무의 공식화", "다단계 보고체계", "수평적 소통체계", "높은 직무 전문화", "프로세스의 표준화"], answer: 3,
        explanation: "[정답] ③ 수평적 소통체계\n\n[상세 해설]\n기계적 조직은 엄격한 계층제, 높은 직무 전문화, 공식화 및 수직적 의사소통 체계를 특징으로 합니다. 수평적 소통체계는 환경 변화에 유연하게 대응하는 유기적(Organic) 조직의 주요 특징입니다."
      },
      {
        id: 9,
        category: "경영 - 회계",
        question: "09번 문제\n재무상태표는 자산, 부채, 자본으로 구성된다. 다음 중 재무상태표의 자산 계정에 해당하는 항목은?",
        options: ["선급금", "자본금", "매입채무", "미지급금", "이익잉여금"],
        answer: 1,
        explanation: "[정답] ① 선급금\n\n[상세 해설]\n선급금은 상품이나 원재료 등을 매입하기 위해 계약금 명목으로 미리 지급한 돈으로, 향후 상품이나 서비스를 제공받을 권리가 있으므로 자산에 해당합니다.\n(자본금, 이익잉여금: 자본 / 매입채무, 미지급금: 부채)"
      },
      {
        id: 10,
        category: "경영 - 전략",
        question: "10번 문제\n다음 중 마이클 포터의 산업구조분석 모형(5 Forces Model)에 대한 설명으로 가장 올바르지 않은 것은?",
        options: ["산업 내 경쟁의 변화를 동태적으로 분석한다.", "공급자의 교섭력이 강화되면 기업의 수익성은 감소하게 된다.", "경쟁기업 간의 동질성이 높을수록 해당 산업의 평균 수익률은 낮아지게 된다.", "제품차별화 정도가 높을수록 기업은 상대적으로 높은 수익률을 얻을 수 있다.", "특정 산업 분야에 신규로 진출하려는 기업이 해당 산업의 전망을 파악하는 데 활용할 수 있다."],
        answer: 1,
        explanation: "[정답] ① 산업 내 경쟁의 변화를 동태적으로 분석한다.\n\n[상세 해설]\n5 Forces 모형은 특정 시점의 산업 구조와 경쟁 강도를 분석하는 '정태적(Static)' 분석 도구라는 대표적인 한계점을 가집니다. 시간의 흐름에 따른 산업의 동태적 변화 과정을 포착하기는 어렵습니다."
      },
      {
        id: 11,
        category: "경영 - 마케팅",
        question: "11번 문제\n다음 중 소비자에게 제품의 우수성 및 브랜드 가치를 전달하기 위해 고의로 높은 가격을 책정하는 가격전략은?",
        options: ["단수가격 전략", "명성과격 전략", "관습가격 전략", "유보가격 전략", "준거가격 전략"],
        answer: 2,
        explanation: "[정답] ② 명성과격 전략 (Prestige Pricing)\n\n[상세 해설]\n명성과격 전략은 고가격이 고품질이나 높은 사회적 지위를 상징한다는 소비자의 심리를 이용하여 고급 브랜드, 사치품 등에 높은 가격을 설정하는 심리적 가격전략입니다."
      },
      {
        id: 12,
        category: "경영 - 마케팅",
        question: "12번 문제\n다음 중 시장세분화 기준 변수 중 행동적 세분화(Behavioral Segmentation) 변수에 해당하는 것은?",
        options: ["소득 수준", "성별", "브랜드 충성도", "인구밀도", "라이프스타일"],
        answer: 3,
        explanation: "[정답] ③ 브랜드 충성도\n\n[상세 해설]\n- 행동적 변수: 브랜드 충성도, 사용량, 추구하는 편익, 구매 준비 단계\n- 인구통계적 변수: 소득, 성별, 연령, 직업\n- 지리적 변수: 인구밀도, 도시 규모, 기후\n- 심리분석적 변수: 라이프스타일, 개성"
      },
      {

    let currentIndex = 0;
    const userAnswers = {};

    function renderOmr() {
      const omrList = document.getElementById("omrList");
      omrList.innerHTML = "";

      let correctCount = 0;

      questions.forEach((q, idx) => {
        const item = document.createElement("div");
        item.className = `omr-item ${idx === currentIndex ? "active" : ""}`;
        
        const selected = userAnswers[idx];
        let statusText = "미기입";
        let statusClass = "status-unanswered";

        if (selected !== undefined) {
          if (selected === q.answer) {
            statusText = "정답";
            statusClass = "status-correct";
            correctCount++;
          } else {
            statusText = "오답";
            statusClass = "status-wrong";
          }
        }

        item.innerHTML = `
          <span>${idx + 1}번</span>
          <span class="status-tag ${statusClass}">${statusText}</span>
        `;

        item.onclick = () => {
          currentIndex = idx;
          renderQuestion();
        };

        omrList.appendChild(item);
      });

      document.getElementById("scoreSummary").innerText = `맞힘: ${correctCount}/${questions.length}`;
    }

    function renderQuestion() {
      const q = questions[currentIndex];
      document.getElementById("categoryBadge").innerText = q.category;
      document.getElementById("currentIndex").innerText = currentIndex + 1;
      document.getElementById("totalIndex").innerText = questions.length;
      document.getElementById("questionTitle").innerText = q.question;

      const optionsList = document.getElementById("optionsList");
      optionsList.innerHTML = "";

      const explanationBox = document.getElementById("explanationBox");
      explanationBox.style.display = "none";

      q.options.forEach((opt, idx) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerText = `${idx + 1}. ${opt}`;

        const selectedOption = userAnswers[currentIndex];
        if (selectedOption !== undefined) {
          if (idx + 1 === q.answer) {
            btn.classList.add("correct");
          } else if (idx + 1 === selectedOption) {
            btn.classList.add("wrong");
          }
          explanationBox.style.display = "block";
          explanationBox.innerText = q.explanation;
        }

        btn.onclick = () => selectOption(idx + 1);
        optionsList.appendChild(btn);
      });

      document.getElementById("prevBtn").disabled = currentIndex === 0;
      document.getElementById("nextBtn").innerText = currentIndex === questions.length - 1 ? "완료" : "다음";

      renderOmr();
    }

    function selectOption(optionIndex) {
      if (userAnswers[currentIndex] !== undefined) return;
      userAnswers[currentIndex] = optionIndex;
      renderQuestion();
    }

    function prevQuestion() {
      if (currentIndex > 0) {
        currentIndex--;
        renderQuestion();
      }
    }

    function nextQuestion() {
      if (currentIndex < questions.length - 1) {
        currentIndex++;
        renderQuestion();
      } else {
        alert("모든 문제를 확인했습니다.");
      }
    }

    // 초기화 실행
    renderQuestion();
